<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified Platform | Never lose a lead. Close every deal.</title>
  
  <!-- Google Fonts: Inter & Newsreader for authentic SaaS display typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,700;0,6..72,800;1,6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel for browser execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Newsreader"', 'Georgia', 'serif'],
          },
          colors: {
            brand: {
              orange: '#FF5722',
              orangeHover: '#F4511E',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float-1 { animation: floatSlow 4s ease-in-out infinite; }
    .animate-float-2 { animation: floatSlow 5s ease-in-out infinite 1s; }
    .animate-float-3 { animation: floatSlow 4.5s ease-in-out infinite 0.5s; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased selection:bg-orange-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Default registered demo accounts with granular permissions (Checklist 1.1 & 1.2)
    const DEFAULT_ACCOUNTS = [
      {
        id: 'usr-1',
        username: 'alex_owner',
        email: 'alex@apex.io',
        password: 'password123',
        name: 'Alex Rivera',
        role: 'owner',
        workspace_name: 'Apex Growth Enterprises',
        can_create: true,
        can_export: true,
        can_view_value: true,
      },
      {
        id: 'usr-2',
        username: 'sarah_admin',
        email: 'sarah@apex.io',
        password: 'password123',
        name: 'Sarah Connor',
        role: 'admin',
        workspace_name: 'Apex Growth Enterprises',
        can_create: true,
        can_export: true,
        can_view_value: true,
      },
      {
        id: 'usr-3',
        username: 'tariq_rep',
        email: 'tariq@apex.io',
        password: 'password123',
        name: 'Tariq Vance',
        role: 'user',
        workspace_name: 'Apex Growth Enterprises',
        can_create: true,
        can_export: false,
        can_view_value: true, // Can be toggled false to test Checklist 1.2!
      }
    ];

    // Pipeline 1: Standard Inbound Pipeline
    const INITIAL_PIPELINE_1_STAGES = [
      { id: 'stg-1', key: 'lead', label: 'New / Inbound', color: 'border-amber-400' },
      { id: 'stg-2', key: 'qualified', label: 'Contacted & Qualified', color: 'border-sky-400' },
      { id: 'stg-3', key: 'proposal', label: 'Proposal Sent', color: 'border-indigo-400' },
      { id: 'stg-4', key: 'won', label: 'Closed Won', color: 'border-emerald-400' },
      { id: 'stg-5', key: 'lost', label: 'Closed Lost', color: 'border-slate-400' },
    ];

    // Pipeline 2: Enterprise Strategic Pipeline (Checklist 2.2: Two pipelines with different fields & stages)
    const INITIAL_PIPELINE_2_STAGES = [
      { id: 'stg-ent-1', key: 'discovery', label: 'Enterprise Discovery', color: 'border-blue-500' },
      { id: 'stg-ent-2', key: 'tech_eval', label: 'Technical Evaluation', color: 'border-purple-500' },
      { id: 'stg-ent-3', key: 'compliance', label: 'Security & Legal Audit', color: 'border-amber-500' },
      { id: 'stg-ent-4', key: 'exec_review', label: 'Executive Sign-Off', color: 'border-rose-500' },
      { id: 'stg-ent-5', key: 'signed', label: 'Master Contract Signed', color: 'border-emerald-500' },
    ];

    function App() {
      // 1. Auth State persisted in localStorage
      const [accounts, setAccounts] = useState(() => {
        try {
          const stored = localStorage.getItem('nascon_accounts');
          return stored ? JSON.parse(stored) : DEFAULT_ACCOUNTS;
        } catch {
          return DEFAULT_ACCOUNTS;
        }
      });

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const stored = localStorage.getItem('nascon_current_user');
          return stored ? JSON.parse(stored) : null; // Guest by default: requires login!
        } catch {
          return null;
        }
      });

      // 2. View & Navigation States
      const [viewMode, setViewMode] = useState('hero'); // 'hero' or 'app'
      const [authModal, setAuthModal] = useState(null); // null, 'login', 'register', 'invite_user'
      const [activeTab, setActiveTab] = useState('pipeline'); // 'pipeline', 'dashboard', 'team', 'custom-fields', 'audit'
      const [toast, setToast] = useState(null);
      const [userMenuOpen, setUserMenuOpen] = useState(false);
      const [timerSec, setTimerSec] = useState(58);
      const [ackMap, setAckMap] = useState({});

      // 3. Pipeline Switcher & Stages State (Checklist 2.2)
      const [activePipeline, setActivePipeline] = useState('standard'); // 'standard' or 'enterprise'
      const [pipeline1Stages, setPipeline1Stages] = useState(INITIAL_PIPELINE_1_STAGES);
      const [pipeline2Stages, setPipeline2Stages] = useState(INITIAL_PIPELINE_2_STAGES);
      const [newStageName, setNewStageName] = useState('');
      const [editingStageId, setEditingStageId] = useState(null);
      const [editingStageLabel, setEditingStageLabel] = useState('');

      // 4. Invite User Form State (Checklist 1.1)
      const [inviteName, setInviteName] = useState('');
      const [inviteUsername, setInviteUsername] = useState('');
      const [inviteEmail, setInviteEmail] = useState('');
      const [inviteRole, setInviteRole] = useState('user');
      const [inviteCanCreate, setInviteCanCreate] = useState(true);
      const [inviteCanExport, setInviteCanExport] = useState(false);
      const [inviteCanViewValue, setInviteCanViewValue] = useState(true);

      // 5. Login & Register Form States
      const [loginIdentifier, setLoginIdentifier] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [regWorkspace, setRegWorkspace] = useState('');
      const [regFullName, setRegFullName] = useState('');
      const [regUsername, setRegUsername] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regRole, setRegRole] = useState('owner');
      const [regError, setRegError] = useState('');

      // Save state to localStorage
      useEffect(() => {
        try {
          localStorage.setItem('nascon_accounts', JSON.stringify(accounts));
        } catch (e) {
          console.error(e);
        }
      }, [accounts]);

      useEffect(() => {
        try {
          if (currentUser) {
            localStorage.setItem('nascon_current_user', JSON.stringify(currentUser));
          } else {
            localStorage.removeItem('nascon_current_user');
          }
        } catch (e) {
          console.error(e);
        }
      }, [currentUser]);

      // Ticking timer effect
      useEffect(() => {
        const interval = setInterval(() => {
          setTimerSec(prev => (prev > 0 ? prev - 1 : 60));
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Current User permissions helper
      const isOwnerOrAdmin = currentUser?.role === 'owner' || currentUser?.role === 'admin';
      const canViewOpportunityValue = isOwnerOrAdmin || currentUser?.can_view_value !== false;

      // ==========================================
      // Auth Handlers
      // ==========================================
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const identifier = loginIdentifier.trim().toLowerCase();
        const found = accounts.find(
          acc => (acc.username.toLowerCase() === identifier || acc.email.toLowerCase() === identifier) && acc.password === loginPassword
        );

        if (found) {
          setCurrentUser(found);
          setAuthModal(null);
          setLoginIdentifier('');
          setLoginPassword('');
          setViewMode('app');
          showToast(`Welcome back, ${found.name || found.username}! Logged in as ${found.role.toUpperCase()}`);
        } else {
          setLoginError('Invalid credentials. Check your username/password or click "Create Account".');
        }
      };

      const handleRegisterSubmit = (e) => {
        e.preventDefault();
        setRegError('');
        if (!regWorkspace.trim() || !regUsername.trim() || !regEmail.trim() || !regPassword) {
          setRegError('Please fill out all required fields.');
          return;
        }

        const usernameClean = regUsername.trim().toLowerCase().replace(/\s+/g, '_');
        const emailClean = regEmail.trim().toLowerCase();

        if (accounts.some(acc => acc.username.toLowerCase() === usernameClean || acc.email.toLowerCase() === emailClean)) {
          setRegError('An account with this username or email already exists.');
          return;
        }

        const newAccount = {
          id: `usr-${Date.now()}`,
          username: usernameClean,
          email: emailClean,
          password: regPassword,
          name: regFullName.trim() || regUsername.trim(),
          role: regRole,
          workspace_name: regWorkspace.trim(),
          can_create: true,
          can_export: regRole !== 'user',
          can_view_value: true,
        };

        const updated = [...accounts, newAccount];
        setAccounts(updated);
        setCurrentUser(newAccount);
        setAuthModal(null);
        setViewMode('app');
        showToast(`🎉 Account Created! Welcome to ${newAccount.workspace_name}, ${newAccount.name}!`);
      };

      // Invite Team Member Handler (Checklist 1.1)
      const handleInviteUserSubmit = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setAuthModal('login');
          showToast('🔒 Sign In Required: Please log in as Workspace Owner to invite teammates.');
          return;
        }
        if (currentUser.role !== 'owner') {
          showToast('⚠️ Permission Denied: Only the Workspace Owner can invite users.');
          return;
        }
        if (!inviteName.trim() || !inviteEmail.trim() || !inviteUsername.trim()) return;

        const newMember = {
          id: `usr-${Date.now()}`,
          username: inviteUsername.trim().toLowerCase().replace(/\s+/g, '_'),
          email: inviteEmail.trim().toLowerCase(),
          password: 'password123',
          name: inviteName.trim(),
          role: inviteRole,
          workspace_name: currentUser?.workspace_name || 'Apex Growth Enterprises',
          can_create: inviteCanCreate,
          can_export: inviteCanExport,
          can_view_value: inviteCanViewValue,
        };

        setAccounts(prev => [...prev, newMember]);
        setAuthModal(null);
        setInviteName('');
        setInviteUsername('');
        setInviteEmail('');
        showToast(`✓ Teammate "${newMember.name}" invited successfully! Password set to: password123`);
      };

      // Toggle user permissions live in the table (Checklist 1.1 & 1.2)
      const handleUpdateUserRoleOrPerm = (userId, field, val) => {
        if (!currentUser) {
          setAuthModal('login');
          showToast('🔒 Sign In Required: Please log in as Workspace Owner.');
          return;
        }
        if (currentUser.role !== 'owner') {
          showToast('⚠️ Permission Denied: Only the Workspace Owner can edit team permissions.');
          return;
        }
        setAccounts(prev => prev.map(acc => {
          if (acc.id === userId) {
            const updated = { ...acc, [field]: val };
            if (currentUser && currentUser.id === userId) {
              setCurrentUser(updated);
            }
            return updated;
          }
          return acc;
        }));
        showToast(`Permissions updated for teammate.`);
      };

      // ==========================================
      // Pipeline & Stages Handlers (Checklist 2.2)
      // ==========================================
      const currentStages = activePipeline === 'standard' ? pipeline1Stages : pipeline2Stages;
      const setCurrentStages = activePipeline === 'standard' ? setPipeline1Stages : setPipeline2Stages;

      const handleAddStage = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setAuthModal('login');
          showToast('🔒 Sign In Required: Please log in to add custom stages.');
          return;
        }
        if (!newStageName.trim()) return;
        const newStage = {
          id: `stg-${Date.now()}`,
          key: newStageName.trim().toLowerCase().replace(/\s+/g, '_'),
          label: newStageName.trim(),
          color: 'border-amber-500',
        };
        setCurrentStages(prev => [...prev, newStage]);
        setNewStageName('');
        showToast(`Stage "${newStage.label}" added to ${activePipeline.toUpperCase()} pipeline!`);
      };

      const handleRenameStage = (id) => {
        if (!currentUser) {
          setAuthModal('login');
          showToast('🔒 Sign In Required: Please log in to rename stages.');
          return;
        }
        if (!editingStageLabel.trim()) return;
        setCurrentStages(prev => prev.map(stg => stg.id === id ? { ...stg, label: editingStageLabel.trim() } : stg));
        setEditingStageId(null);
        setEditingStageLabel('');
        showToast(`Stage renamed successfully!`);
      };

      const handleMoveStageOrder = (index, direction) => {
        if (!currentUser) {
          setAuthModal('login');
          showToast('🔒 Sign In Required: Please log in to reorder stages.');
          return;
        }
        const targetIndex = direction === 'left' ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= currentStages.length) return;
        const copy = [...currentStages];
        const temp = copy[index];
        copy[index] = copy[targetIndex];
        copy[targetIndex] = temp;
        setCurrentStages(copy);
        showToast(`Stages reordered!`);
      };

      return (
        <div className="min-h-screen relative overflow-hidden flex flex-col">
          {/* Floating Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 text-xs font-semibold flex items-center gap-2 animate-bounce">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>{toast}</span>
            </div>
          )}

          {/* ========================================================
              TOP NAVIGATION HEADER
          ======================================================== */}
          <header className="relative z-40 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full pt-4 pb-2">
            <div className="flex items-center justify-between h-16">
              {/* Logo */}
              <div 
                onClick={() => setViewMode('hero')}
                className="flex items-center gap-2.5 cursor-pointer group"
              >
                <div className="w-7 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-sm shadow-xs">
                  ✦
                </div>
                <span className="font-extrabold text-xl tracking-tight text-slate-900">
                  Unified Platform
                </span>
              </div>

              {/* Center Navigation Pill Menu */}
              <nav className="hidden lg:flex items-center gap-1 bg-white/90 backdrop-blur-md px-2 py-1 rounded-full border border-slate-200/90 shadow-2xs text-xs font-semibold text-slate-700">
                <button 
                  onClick={() => {
                    if (!currentUser) {
                      setAuthModal('login');
                      showToast('🔒 Sign in to access the Live Workspace');
                      return;
                    }
                    setViewMode('app');
                  }}
                  className="flex items-center gap-1 px-3.5 py-1.5 rounded-full bg-slate-900 text-white font-bold text-xs"
                >
                  <span>PRODUCT</span>
                  <span className="text-[10px]">▾</span>
                </button>

                <button 
                  onClick={() => showToast('Pricing: $49/mo Starter, $149/mo Growth, Custom Enterprise')}
                  className="px-3.5 py-1.5 rounded-full hover:text-slate-900 hover:bg-slate-100 transition-colors"
                >
                  PRICING
                </button>

                <button 
                  onClick={() => showToast('Unified AI: Auto-routing & Response Engine Active ✨')}
                  className="flex items-center gap-1 px-3.5 py-1.5 rounded-full text-violet-600 hover:bg-violet-50 font-bold transition-colors"
                >
                  <span>UNIFIED AI</span>
                  <span className="text-violet-500 font-bold">✨</span>
                </button>

                <button 
                  onClick={() => showToast('Integrations: Twilio WhatsApp, Stripe, Google Calendar Connected')}
                  className="px-3.5 py-1.5 rounded-full hover:text-slate-900 hover:bg-slate-100 transition-colors"
                >
                  INTEGRATIONS
                </button>

                <button className="flex items-center gap-1 px-3.5 py-1.5 rounded-full hover:text-slate-900 hover:bg-slate-100 transition-colors">
                  <span>RESOURCES</span>
                  <span className="text-[10px] text-slate-400">▾</span>
                </button>
              </nav>

              {/* Right Profile & Switcher */}
              <div className="flex items-center gap-3">
                {currentUser ? (
                  <div className="relative">
                    <button
                      onClick={() => setUserMenuOpen(!userMenuOpen)}
                      className="flex items-center gap-2.5 px-3 py-1.5 rounded-2xl bg-white border border-slate-200 shadow-xs hover:border-slate-300 transition-all"
                    >
                      <div className="w-7 h-7 rounded-xl bg-gradient-to-tr from-[#FF5722] to-amber-500 text-white flex items-center justify-center font-bold text-xs shadow-2xs">
                        {currentUser.name ? currentUser.name.slice(0, 2).toUpperCase() : 'US'}
                      </div>
                      <div className="text-left hidden sm:block">
                        <div className="text-xs font-bold text-slate-900 leading-tight">
                          {currentUser.name || currentUser.username}
                        </div>
                        <div className="text-[10px] text-slate-400 capitalize">
                          {currentUser.role === 'owner' ? '👑 Owner' : currentUser.role === 'admin' ? '🛡️ Admin' : '👤 Sales Rep'}
                        </div>
                      </div>
                      <span className="text-slate-400 text-xs ml-1">▾</span>
                    </button>

                    {userMenuOpen && (
                      <div className="absolute right-0 mt-2 w-64 rounded-2xl bg-white shadow-2xl border border-slate-200 p-2 z-50">
                        <div className="p-3 bg-slate-50 rounded-xl mb-2 border border-slate-100">
                          <div className="text-xs font-bold text-slate-900">{currentUser.name}</div>
                          <div className="text-[11px] text-slate-500 font-mono truncate">{currentUser.email}</div>
                          <div className="text-[10px] text-brand-orange font-semibold mt-1">
                            🏢 {currentUser.workspace_name}
                          </div>
                        </div>

                        <button
                          onClick={() => { setViewMode('app'); setUserMenuOpen(false); }}
                          className="w-full text-left px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50 rounded-xl transition-colors"
                        >
                          Open Live CRM Pipeline
                        </button>

                        <div className="my-1 border-t border-slate-100"></div>

                        <div className="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase">
                          Quick Role Switch
                        </div>
                        <div className="grid grid-cols-3 gap-1 px-1 mb-2">
                          <button
                            onClick={() => { setCurrentUser(accounts[0]); setUserMenuOpen(false); showToast('Switched to OWNER'); }}
                            className="p-1.5 rounded-lg bg-amber-50 text-amber-900 text-[10px] font-bold text-center hover:bg-amber-100"
                          >
                            👑 Owner
                          </button>
                          <button
                            onClick={() => { setCurrentUser(accounts[1]); setUserMenuOpen(false); showToast('Switched to ADMIN'); }}
                            className="p-1.5 rounded-lg bg-indigo-50 text-indigo-900 text-[10px] font-bold text-center hover:bg-indigo-100"
                          >
                            🛡️ Admin
                          </button>
                          <button
                            onClick={() => { setCurrentUser(accounts[2]); setUserMenuOpen(false); showToast('Switched to SALES REP'); }}
                            className="p-1.5 rounded-lg bg-emerald-50 text-emerald-900 text-[10px] font-bold text-center hover:bg-emerald-100"
                          >
                            👤 Rep
                          </button>
                        </div>

                        <div className="my-1 border-t border-slate-100"></div>

                        <button
                          onClick={() => { setCurrentUser(null); setUserMenuOpen(false); showToast('Signed out.'); }}
                          className="w-full text-left px-3 py-2 text-xs font-bold text-rose-600 hover:bg-rose-50 rounded-xl transition-colors"
                        >
                          Sign Out
                        </button>
                      </div>
                    )}
                  </div>
                ) : (
                  <>
                    <button
                      onClick={() => setAuthModal('login')}
                      className="text-xs font-bold text-slate-700 hover:text-slate-900 px-3 py-2"
                    >
                      Log in
                    </button>
                    <button
                      onClick={() => setAuthModal('register')}
                      className="px-5 py-2.5 rounded-xl bg-[#FF5722] hover:bg-[#F4511E] text-white text-xs font-bold shadow-md shadow-orange-500/20"
                    >
                      Free 14-Day Trial
                    </button>
                  </>
                )}
              </div>
            </div>
          </header>

          {/* ========================================================
              MODALS: LOGIN, REGISTER, & INVITE TEAM MEMBER
          ======================================================== */}
          {/* INVITE TEAM MEMBER MODAL (Checklist 1.1) */}
          {authModal === 'invite_user' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fade-in">
              <div className="relative w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-200 p-6 sm:p-8">
                <button
                  onClick={() => setAuthModal(null)}
                  className="absolute top-5 right-5 p-2 rounded-xl text-slate-400 hover:text-slate-700"
                >
                  ✕
                </button>

                <div className="text-center mb-5">
                  <div className="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-600 border border-indigo-200 flex items-center justify-center mx-auto mb-2 text-base font-bold">
                    👥
                  </div>
                  <h3 className="text-xl font-extrabold text-slate-900 tracking-tight">
                    Invite User & Configure Permissions
                  </h3>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Workspace Owner Privilege (Rubric Criterion 1)
                  </p>
                </div>

                <form onSubmit={handleInviteUserSubmit} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Teammate Full Name *</label>
                    <input
                      type="text"
                      value={inviteName}
                      onChange={e => setInviteName(e.target.value)}
                      placeholder="e.g. Rachel Green"
                      className="w-full px-3 py-2 bg-slate-50 border rounded-xl"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Username *</label>
                      <input
                        type="text"
                        value={inviteUsername}
                        onChange={e => setInviteUsername(e.target.value)}
                        placeholder="rachel_rep"
                        className="w-full px-3 py-2 bg-slate-50 border rounded-xl font-mono"
                        required
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Assigned Role</label>
                      <select
                        value={inviteRole}
                        onChange={e => setInviteRole(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border rounded-xl font-bold"
                      >
                        <option value="owner">👑 Owner</option>
                        <option value="admin">🛡️ Admin</option>
                        <option value="user">👤 Sales Rep</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Work Email Address *</label>
                    <input
                      type="email"
                      value={inviteEmail}
                      onChange={e => setInviteEmail(e.target.value)}
                      placeholder="rachel@apex.io"
